# Chạy bằng ảnh đã đẩy lên Docker Hub.
# Tạo file .env (không commit) cùng thư mục với nội dung:
#   MONGODB_URI=mongodb+srv://<user>:<password>@<cluster>/cloud_lab
services:
  backend:
    image: hoaingocadmin/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Hãy khai báo MONGODB_URI trong file .env}
      CLIENT_URL: http://localhost:3000
    restart: unless-stopped

  frontend:
    image: hoaingocadmin/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped
